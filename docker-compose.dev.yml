services:
  postgres:
    profiles: ["dev"]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5433:5432"
    volumes:
      - ./docker/init-databases.sql:/docker-entrypoint-initdb.d/00-init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 15

  users:
    profiles: ["dev"]
    image: eclipse-temurin:17-jdk-jammy
    working_dir: /workspace
    volumes:
      - .:/workspace
      - maven_cache:/root/.m2
    command: >-
      bash -lc "chmod +x mvnw && ./mvnw -DskipTests -Dspotless.check.skip=true -Dcheckstyle.skip=true spring-boot:run -Dspring-boot.run.profiles=docker"
    ports:
      - "28082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JWT_SECRET: ${JWT_SECRET:-devonlyjwtsecretmin32characterslong00}
      JWT_LIFETIME_MINUTES: ${JWT_LIFETIME_MINUTES:-1440}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-postgres}
    depends_on:
      postgres:
        condition: service_healthy

  product:
    profiles: ["dev"]
    image: eclipse-temurin:17-jdk-jammy
    working_dir: /workspace/ServiceForProduct
    volumes:
      - ./ServiceForProduct:/workspace/ServiceForProduct
      - ./checkstyle.xml:/workspace/checkstyle.xml:ro
      - maven_cache:/root/.m2
    command: >-
      bash -lc "chmod +x mvnw && ./mvnw -DskipTests -Dspotless.check.skip=true -Dcheckstyle.skip=true spring-boot:run -Dspring-boot.run.profiles=docker"
    ports:
      - "28081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      postgres:
        condition: service_healthy
      users:
        condition: service_started

  cart:
    profiles: ["dev"]
    image: eclipse-temurin:17-jdk-jammy
    working_dir: /workspace/ServiceForCart
    volumes:
      - ./ServiceForCart:/workspace/ServiceForCart
      - ./checkstyle.xml:/workspace/checkstyle.xml:ro
      - maven_cache:/root/.m2
    command: >-
      bash -lc "chmod +x mvnw && ./mvnw -DskipTests -Dspotless.check.skip=true -Dcheckstyle.skip=true spring-boot:run -Dspring-boot.run.profiles=docker"
    ports:
      - "28083:8083"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      postgres:
        condition: service_healthy
      users:
        condition: service_started
      product:
        condition: service_started

  pay:
    profiles: ["dev"]
    image: eclipse-temurin:17-jdk-jammy
    working_dir: /workspace/ServiceForPay
    volumes:
      - ./ServiceForPay:/workspace/ServiceForPay
      - ./checkstyle.xml:/workspace/checkstyle.xml:ro
      - maven_cache:/root/.m2
    command: >-
      bash -lc "chmod +x mvnw && ./mvnw -DskipTests -Dspotless.check.skip=true -Dcheckstyle.skip=true spring-boot:run -Dspring-boot.run.profiles=docker"
    ports:
      - "28086:8086"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      kafka:
        condition: service_healthy

  controller:
    profiles: ["dev"]
    image: eclipse-temurin:17-jdk-jammy
    working_dir: /workspace/Controller
    volumes:
      - ./Controller:/workspace/Controller
      - ./checkstyle.xml:/workspace/checkstyle.xml:ro
      - maven_cache:/root/.m2
      - marketplace_uploads:/workspace/uploads
    command: >-
      bash -lc "chmod +x mvnw && ./mvnw -DskipTests -Dspotless.check.skip=true -Dcheckstyle.skip=true spring-boot:run -Dspring-boot.run.profiles=docker"
    ports:
      - "28085:8085"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JWT_SECRET: ${JWT_SECRET:-devonlyjwtsecretmin32characterslong00}
      YOOKASSA_SHOP_ID: ${YOOKASSA_SHOP_ID:-}
      YOOKASSA_SECRET_KEY: ${YOOKASSA_SECRET_KEY:-}
      YOOKASSA_RETURN_URL: ${YOOKASSA_RETURN_URL:-http://localhost:5174/payment/return}
    depends_on:
      kafka:
        condition: service_healthy
      ollama:
        condition: service_started
      users:
        condition: service_started
      product:
        condition: service_started
      cart:
        condition: service_started

  frontend:
    profiles: ["dev"]
    image: node:22-bookworm
    working_dir: /app
    environment:
      HUSKY: "0"
      VITE_API_URL: "http://localhost:28085"
    volumes:
      - ./frontend_for_pius:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5174:5173"
    command: >-
      sh -c "npm install --no-audit --fund=false && npm run dev -- --host 0.0.0.0 --port 5173"
    depends_on:
      - controller

volumes:
  maven_cache:
  frontend_node_modules:
  marketplace_uploads:
